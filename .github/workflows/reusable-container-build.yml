name: Reusable protected image build, publish, sign, verify
on:
  workflow_call:
    inputs:
      registry_provider:
        type: string
        required: true
      image_name:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      manual_authorized:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  scan:
    if: github.ref_protected && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build AMD64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: candidate:amd64-${{ inputs.source_sha }}
          cache-from: type=gha,scope=trusted-candidate-amd64
          cache-to: type=gha,mode=max,scope=trusted-candidate-amd64
      - name: Scan AMD64 candidate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" -v "$PWD:/work" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output /work/trivy-amd64.json "candidate:amd64-${{ inputs.source_sha }}"
      - name: Build ARM64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: candidate:arm64-${{ inputs.source_sha }}
          cache-from: type=gha,scope=trusted-candidate-arm64
          cache-to: type=gha,mode=max,scope=trusted-candidate-arm64
      - name: Scan ARM64 candidate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" -v "$PWD:/work" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output /work/trivy-arm64.json "candidate:arm64-${{ inputs.source_sha }}"
      - name: Require both architecture reports to pass
        run: bash scripts/evaluate-trivy.sh --amd64 trivy-amd64.json --arm64 trivy-arm64.json --summary trivy-summary.json
  publish:
    needs: scan
    if: >-
      needs.scan.result == 'success' && github.ref_protected && inputs.source_sha == github.sha &&
      ((github.event_name == 'push') ||
       (github.event_name == 'workflow_dispatch' && inputs.manual_authorized == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: AWS OIDC credentials
        if: inputs.registry_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: AWS ECR login
        if: inputs.registry_provider == 'aws'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Azure OIDC login
        if: inputs.registry_provider == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Azure registry login
        if: inputs.registry_provider == 'azure'
        run: az acr login --name "$AZURE_REGISTRY_NAME"
        env:
          AZURE_REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
      - name: Google Cloud Workload Identity Federation
        if: inputs.registry_provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        if: inputs.registry_provider == 'gcp'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Google Artifact Registry login
        if: inputs.registry_provider == 'gcp'
        run: gcloud auth configure-docker "$GAR_HOST" --quiet
        env:
          GAR_HOST: ${{ vars.GAR_HOST }}
      - name: Build and push multi-platform OCI index after the scan gate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          cache-from: type=gha,scope=trusted-publish
          cache-to: type=gha,mode=max,scope=trusted-publish
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign immutable digest with keyless OIDC
        env:
          IMAGE: ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/${{ inputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify signature identity and issuer
        env:
          IMAGE: ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/${{ inputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNING_IDENTITY: ${{ vars.COSIGN_CERTIFICATE_IDENTITY }}
        run: ./scripts/verify-signature.sh "$IMAGE@$DIGEST" "$SIGNING_IDENTITY" https://token.actions.githubusercontent.com
