name: Candidate container security validation
on:
  workflow_dispatch:
    inputs:
      confirm_external_scan:
        description: Set true to build candidates and use Trivy's vulnerability database
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: candidate-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_external_scan == true && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build AMD64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: sample-container-app:amd64-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan AMD64 candidate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" -v "$PWD:/work" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output /work/trivy-amd64.json "sample-container-app:amd64-${{ github.sha }}"
      - name: Build ARM64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: sample-container-app:arm64-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan ARM64 candidate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" -v "$PWD:/work" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output /work/trivy-arm64.json "sample-container-app:arm64-${{ github.sha }}"
      - name: Require both scan reports to pass
        run: bash scripts/evaluate-trivy.sh --amd64 trivy-amd64.json --arm64 trivy-arm64.json --summary trivy-summary.json
