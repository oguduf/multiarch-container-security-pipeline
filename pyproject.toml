[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multiarch-container-security-pipeline"
version = "0.1.0"
description = "Offline-testable multi-architecture container supply-chain pipeline example"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "PyYAML>=6.0,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
